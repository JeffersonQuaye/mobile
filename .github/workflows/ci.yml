name: MoMoGuard CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: momoguard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff pytest pytest-cov

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/momoguard_test
          MOMOGUARD_AUTH_SECRET: ci-test-secret-key-32-characters-minimum
        run: |
          python backend/migrate.py

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/momoguard_test
          MOMOGUARD_AUTH_SECRET: ci-test-secret-key-32-characters-minimum
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
        run: |
          pytest --cov=backend --cov-report=term-missing backend/tests backend/test_fraud_model.py

  mobile-test:
    name: Mobile App Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Component & End-to-End Tests
        run: npm test

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, mobile-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: momoguard-backend:test
